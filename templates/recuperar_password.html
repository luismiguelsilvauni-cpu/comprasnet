<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Recuperar Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0d14;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:36px;width:100%;max-width:400px}
h1{font-size:20px;font-weight:700;margin-bottom:8px;text-align:center}
p{font-size:13px;color:#94a3b8;text-align:center;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:10px 14px;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#f1f5f9;font-size:14px;outline:none;margin-bottom:16px}
input:focus{border-color:#3b6ef0}
.btn{width:100%;padding:12px;background:#3b6ef0;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.link{text-align:center;margin-top:16px;font-size:13px;color:#64748b}
.link a{color:#3b6ef0;text-decoration:none}
.msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#22c55e;margin-bottom:16px}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#ef4444;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Recuperar Password</h1>
  <p>Introduza o seu email ou username. Será enviada uma password temporária.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in messages %}
    <div class="{{ 'msg' if cat == 'success' else 'err' }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <label>Email ou Username</label>
    <input type="text" name="email_ou_user" required autofocus placeholder="email@empresa.pt ou username">
    <button type="submit" class="btn">Enviar Password Temporária</button>
  </form>
  <div class="link"><a href="{{ url_for('login') }}">← Voltar ao Login</a></div>
</div>
</body>
</html>
